name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型チェック・Lint・テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # package.json の allowScripts（インストール時に実行してよいスクリプト）に対応した npm にそろえる
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      # テストは workerd 上のローカルの D1・R2・Durable Objects で動き、Cloudflare には接続しない
      - run: npm test
        env:
          LOCAL_ONLY: '1'
      - run: npm run build
        env:
          LOCAL_ONLY: '1'
