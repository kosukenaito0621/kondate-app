name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型チェック・Lint・テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # package.json の allowScripts（インストール時に実行してよいスクリプト）に対応した npm にそろえる
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      # テストは workerd 上のローカルの D1・R2・Durable Objects で動き、Cloudflare には接続しない
      - run: npm test
        env:
          LOCAL_ONLY: '1'
      - run: npm run build
        env:
          LOCAL_ONLY: '1'

  deploy:
    name: 本番へデプロイ
    needs: check
    # main への push のときだけ（PR では動かさない）。
    # リポジトリ変数 DEPLOY_ENABLED=true と Cloudflare のシークレットを設定してから有効になる
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://kondate-app.sukeo-appslab.workers.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LOCAL_ONLY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0
      - run: npm ci
      # 先に DB を新しい形にしてから、新しいコードを出す（列の追加だけなので古いコードも動き続ける）
      - run: npm run db:migrate:remote
      # 初期レシピを登録・更新する（同じ ID は上書きするだけなので、何度実行しても同じ結果）
      - run: npm run db:seed:remote
      - run: npm run deploy
