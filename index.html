<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8F3" />
    <meta name="description" content="1週間の献立と買い物リストを、かんたんに。" />
    <script>
      // 描画前に記憶済みのテーマを当てて、色のちらつきを防ぐ
      try {
        var t = localStorage.getItem('kd_theme');
        if (t && /^[a-z]+$/.test(t)) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Nunito:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap"
    />
    <title>こんだて</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
